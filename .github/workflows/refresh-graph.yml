name: Refresh contribution graph

on:
  schedule:
    # Every day at 05:00 UTC
    - cron: "0 5 * * *"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install daily dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements-daily.txt

      - name: Pull contribution data
        run: |
          python tools/pull_contributions.py

      - name: Render contribution graph
        run: |
          python tools/render_graph.py

      - name: Commit updated graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh contribution graph [skip ci]"
          file_pattern: "assets/contributions.json assets/graph.svg"