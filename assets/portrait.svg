<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 672" width="608" height="672">
<style>

        .ascii {
            font-family: "Courier New", monospace;
            font-size: 12px;
            font-weight: 700;
            fill: #00ff88;
            white-space: pre;
        }

        .row {
            clip-path: inset(0 100% 0 0);
            animation:
                reveal 0.75s ease-out forwards;
        }

        @keyframes reveal {

            from {
                clip-path: inset(0 100% 0 0);
            }

            to {
                clip-path: inset(0 0 0 0);
            }

        }
        
</style>
